name: Temporary TPV lockfile synchronization

on:
  push:
    branches:
      - feat/tpv-web-modules-report-2026-11-15
    paths:
      - .github/workflows/tpv-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TPV branch
        uses: actions/checkout@v5
        with:
          ref: feat/tpv-web-modules-report-2026-11-15
          token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Resolve exact lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git commit -m "chore(deps): synchronize Wix Stores SDK lockfile"
            git push origin HEAD:feat/tpv-web-modules-report-2026-11-15
          fi
