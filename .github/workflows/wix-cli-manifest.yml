name: Wix Velo dependency manifest

on:
  push:
    branches:
      - "feat/**"
      - main
    paths:
      - ".github/workflows/wix-cli-manifest.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wix-velo-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-velo-manifest:
    name: Generate Wix CLI manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Install and authenticate Wix CLI for Sites
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY. Create a Wix API key with the 'Wix CLI for Sites - Git Integration' permission and save it as this GitHub secret."
            exit 1
          fi
          npm install --global @wix/cli
          wix login --api-key "${CLI_API_KEY}"

      - name: Record Wix CLI version and install command contract
        run: |
          wix --version
          wix install --help
          echo "Configured Wix site:"
          cat wix.config.json
          echo "Pre-install package declaration:"
          node --input-type=commonjs -e "const version=require('./package.json').dependencies?.['@wix/data']; console.log(version || 'not declared'); if (version !== '1.0.527') { console.error('Expected pinned @wix/data 1.0.527; refusing to alter Wix dependencies.'); process.exit(1); }"

      - name: Install package and capture generated files
        run: |
          wix install --npm @wix/data
          git diff --exit-code -- package.json package-lock.json
          echo "Generated dependency-related files:"
          find . -maxdepth 4 -type f \( -name 'velo.dependencies.json' -o -name 'dependencies-metadata.json' -o -name 'wix.lock' \) -print
          echo "Working tree after Wix CLI installation:"
          git status --short

      - name: Validate generated Velo manifest
        run: |
          if [ ! -s src/velo.dependencies.json ]; then
            echo "::error::Wix CLI completed but src/velo.dependencies.json is missing. Inspect the uploaded artifact before changing the workflow again."
            exit 1
          fi
          node --input-type=commonjs -e "JSON.parse(require('node:fs').readFileSync('src/velo.dependencies.json', 'utf8'))"

      - name: Commit only generated Wix metadata
        run: |
          git add -- src/velo.dependencies.json
          if [ -f dependencies-metadata.json ]; then
            git add -- dependencies-metadata.json
          fi
          if git diff --cached --quiet; then
            echo "Velo manifest already current; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(wix): generate Velo dependency manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Preserve CLI output for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-velo-manifest-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            src/velo.dependencies.json
            dependencies-metadata.json
            package.json
            package-lock.json
            wix.lock
