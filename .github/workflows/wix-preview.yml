name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
        timeout-minutes: 3

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
        timeout-minutes: 3

      - name: Install project dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --no-audit --no-fund
        timeout-minutes: 7

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli --no-audit --no-fund
        timeout-minutes: 5

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        shell: bash
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi
          wix --version
          wix login --api-key "${CLI_API_KEY}"
        timeout-minutes: 3

      - name: Create Wix preview
        env:
          TERM: xterm-256color
          COLUMNS: "160"
          LINES: "40"
          FORCE_COLOR: "1"
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          : > wix-preview.log

          # Wix CLI for Sites uses an interactive selector. A zero-sized PTY
          # suppresses the selector, so set a real terminal size before spawn.
          # Strip ANSI CSI styling only for prompt detection; preserve raw output.
          python3 - <<'PY' | tee wix-preview.log
          import fcntl
          import os
          import pty
          import re
          import select
          import signal
          import struct
          import subprocess
          import sys
          import termios
          import time

          env = os.environ.copy()
          env.pop("CI", None)
          env["TERM"] = "xterm-256color"
          env["COLUMNS"] = "160"
          env["LINES"] = "40"

          master, slave = pty.openpty()
          fcntl.ioctl(slave, termios.TIOCSWINSZ, struct.pack("HHHH", 40, 160, 0, 0))
          process = subprocess.Popen(
              ["wix", "preview"],
              stdin=slave,
              stdout=slave,
              stderr=slave,
              env=env,
              close_fds=True,
              start_new_session=True,
          )
          os.close(slave)

          started = time.monotonic()
          prompt_deadline = started + 90
          overall_deadline = started + 540
          output = bytearray()
          selection_sent = False
          failure = None
          ansi_csi = re.compile(bytes([27]) + b"\\[[0-?]*[ -/]*[@-~]")

          def visible_text(data):
              text = ansi_csi.sub(b"", data).decode("utf-8", errors="replace")
              return " ".join(text.split())

          try:
              while True:
                  now = time.monotonic()
                  if now >= overall_deadline:
                      failure = "Wix preview exceeded the 9-minute execution limit."
                      break

                  ready, _, _ = select.select([master], [], [], 0.25)
                  if ready:
                      try:
                          chunk = os.read(master, 4096)
                      except OSError:
                          chunk = b""
                      if chunk:
                          sys.stdout.buffer.write(chunk)
                          sys.stdout.buffer.flush()
                          output.extend(chunk)
                          if len(output) > 65536:
                              del output[:-8192]

                          prompt_text = visible_text(output)
                          prompt_visible = (
                              "What would you like to preview?" in prompt_text
                              and "Latest commit from origin/main" in prompt_text
                          )
                          if not selection_sent and prompt_visible:
                              os.write(master, b"\r")
                              selection_sent = True
                              print(
                                  "\\n[automation] Selected documented default: "
                                  "Latest commit from origin/main",
                                  flush=True,
                              )
                      elif process.poll() is not None:
                          break

                  status = process.poll()
                  if status is not None:
                      break

                  if not selection_sent and now >= prompt_deadline:
                      failure = (
                          "Wix CLI did not render the documented preview selector "
                          "within 90 seconds. No input was sent."
                      )
                      break

              if failure:
                  try:
                      os.killpg(process.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      process.wait()
                  print(f"::error::{failure}", file=sys.stderr, flush=True)
                  print("Captured Wix CLI output:", file=sys.stderr, flush=True)
                  print(visible_text(output), file=sys.stderr, flush=True)
                  sys.exit(1)

              status = process.wait()
              if not selection_sent:
                  print(
                      "::error::Wix CLI exited before rendering its documented "
                      "preview selector; preview was not created.",
                      file=sys.stderr,
                      flush=True,
                  )
                  sys.exit(1)
              sys.exit(status)
          finally:
              os.close(master)
          PY

          preview_url="$(grep -Eo 'https?://wix\.to/[[:alnum:]]+' wix-preview.log | tail -n 1 || true)"
          if [ -z "${preview_url}" ]; then
            echo "::error::Wix CLI finished without a verifiable wix.to preview URL."
            cat wix-preview.log || true
            exit 1
          fi

          echo "url=${preview_url}" >> "${GITHUB_OUTPUT}"
          echo "Wix preview created: ${preview_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: warn
          path: wix-preview.log
