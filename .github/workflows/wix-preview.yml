name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        shell: bash
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi

          wix login --api-key "${CLI_API_KEY}"

      - name: Create Wix preview (non-interactive)
        shell: bash
        run: |
          set -euo pipefail
          : > wix-preview.log

          # Run the Wix-documented GitHub Actions command without allocating a TTY.
          set +e
          timeout --signal=TERM --kill-after=30s 15m \
            npm run wix preview 2>&1 | tee wix-preview.log
          PREVIEW_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "${PREVIEW_EXIT}" -ne 0 ]; then
            if [ "${PREVIEW_EXIT}" -eq 124 ] || [ "${PREVIEW_EXIT}" -eq 137 ]; then
              echo "::error::Wix Preview exceeded the 15-minute limit."
            else
              echo "::error::Wix CLI preview failed with exit code ${PREVIEW_EXIT}."
            fi
            exit "${PREVIEW_EXIT}"
          fi

          PREVIEW_URL="$(grep -Eo 'https?://wix\\.to/[[:alnum:]]+' wix-preview.log | tail -n 1 || true)"
          if [ -z "${PREVIEW_URL}" ]; then
            echo "::error::Wix CLI completed without a verifiable wix.to preview URL."
            exit 1
          fi

          echo "url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          echo "Wix Preview created: ${PREVIEW_URL}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: warn
          path: wix-preview.log
