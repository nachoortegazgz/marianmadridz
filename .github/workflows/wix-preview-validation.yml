name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi
          wix login --api-key "${CLI_API_KEY}"

      - name: Create Wix preview from latest main (never publish)
        env:
          TERM: "xterm"
        run: |
          set -euo pipefail
          rm -f wix-preview.log

          if ! command -v script >/dev/null 2>&1; then
            echo "::error::util-linux script command is required to provide the TTY expected by Wix CLI."
            exit 1
          fi

          # Wix CLI for Sites is interactive. Give it a real pseudo-terminal and
          # accept its documented default: Latest commit from origin/main.
          # Unset CI only for this TTY-backed command; GitHub remains the runner.
          timeout 8m script -q -e -c 'env -u CI wix preview' wix-preview.log <<<''
          cat wix-preview.log

          PREVIEW_URL="$(grep -Eo 'https?://wix\.to/[[:alnum:]]+' wix-preview.log | tail -n 1 || true)"
          if [ -z "${PREVIEW_URL}" ]; then
            echo "::error::Wix CLI exited without publishing a verifiable wix.to preview URL."
            exit 1
          fi

          echo "url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          echo "Wix Preview created: ${PREVIEW_URL}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: error
          path: |
            wix-preview.log
