name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        shell: bash
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi

          wix login --api-key "${CLI_API_KEY}"

      - name: Create Wix preview
        env:
          TERM: xterm
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          : > wix-preview.log

          if ! command -v script >/dev/null 2>&1; then
            echo "::error::The script command is required to provide a TTY to Wix CLI."
            exit 1
          fi

          set +e
          timeout --signal=TERM --kill-after=15s 6m \
            script -q -e -c 'env -u CI wix preview' /dev/null 2>&1 \
            | tee wix-preview.log
          preview_status=${PIPESTATUS[0]}
          set -e

          if [ "${preview_status}" -ne 0 ]; then
            if [ "${preview_status}" -eq 124 ] || [ "${preview_status}" -eq 137 ]; then
              echo "::error::Wix preview did not finish within 6 minutes. See wix-preview.log for details."
            else
              echo "::error::Wix preview exited with status ${preview_status}. See wix-preview.log for details."
            fi
            exit 1
          fi

          preview_url="$(grep -Eo 'https?://wix\.to/[[:alnum:]]+' wix-preview.log | tail -n 1 || true)"
          if [ -z "${preview_url}" ]; then
            echo "::error::Wix CLI finished without a verifiable wix.to preview URL."
            cat wix-preview.log || true
            exit 1
          fi

          echo "url=${preview_url}" >> "${GITHUB_OUTPUT}"
          echo "Wix preview created: ${preview_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: warn
          path: wix-preview.log
