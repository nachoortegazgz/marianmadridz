name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi
          wix login --api-key "${CLI_API_KEY}"

      - name: Create Wix preview from latest main (never publish)
        env:
          CI: "true"
          TERM: "xterm"
        run: |
          set -euo pipefail
          rm -f wix-preview.log

          printf '\n' | timeout 8m script -q -f -e -c "wix preview" /dev/null > wix-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "${preview_pid}" >/dev/null 2>&1 || true; wait "${preview_pid}" || true' EXIT

          for _ in $(seq 1 240); do
            if grep -Eoq "https?://wix\\.to/[[:alnum:]]+" wix-preview.log; then
              echo "Wix preview URL generated successfully."
              break
            fi

            if ! kill -0 "${preview_pid}" 2>/dev/null; then
              wait "${preview_pid}" || true
              echo "::error::Wix CLI exited before generating a preview URL."
              cat wix-preview.log || true
              exit 1
            fi

            sleep 2
          done

          if ! grep -Eoq "https?://wix\\.to/[[:alnum:]]+" wix-preview.log; then
            echo "::error::Wix preview URL was not generated before timeout."
            cat wix-preview.log || true
            exit 1
          fi

          kill "${preview_pid}" >/dev/null 2>&1 || true
          wait "${preview_pid}" || true

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            wix-preview.log
