name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        shell: bash
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi

          wix login --api-key "${CLI_API_KEY}"

      - name: Create Wix preview
        env:
          TERM: xterm
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          : > wix-preview.log

          # Wix CLI for Sites requires a TTY and presents a commit selector.
          # Wait for the documented default option before accepting it; an
          # immediate newline can arrive before the prompt and leave the CLI
          # blocked indefinitely.
          python3 - <<'PY' | tee wix-preview.log
          import os
          import pty
          import select
          import signal
          import subprocess
          import sys
          import time

          env = os.environ.copy()
          env.pop("CI", None)
          env["TERM"] = env.get("TERM", "xterm")

          master, slave = pty.openpty()
          process = subprocess.Popen(
              ["wix", "preview"],
              stdin=slave,
              stdout=slave,
              stderr=slave,
              env=env,
              close_fds=True,
              start_new_session=True,
          )
          os.close(slave)

          started = time.monotonic()
          prompt_deadline = started + 60
          overall_deadline = started + 420
          output = bytearray()
          selection_sent = False
          failure = None

          try:
              while True:
                  now = time.monotonic()
                  if now >= overall_deadline:
                      failure = "Wix preview exceeded the 7-minute execution limit."
                      break

                  ready, _, _ = select.select([master], [], [], 0.25)
                  if ready:
                      try:
                          chunk = os.read(master, 4096)
                      except OSError:
                          chunk = b""
                      if chunk:
                          sys.stdout.buffer.write(chunk)
                          sys.stdout.buffer.flush()
                          output.extend(chunk)
                          if len(output) > 65536:
                              del output[:-8192]

                          if (not selection_sent
                                  and b"Latest commit from origin/main" in output):
                              os.write(master, b"\r")
                              selection_sent = True
                              print(
                                  "\n[automation] Accepted Wix documented default: "
                                  "Latest commit from origin/main",
                                  flush=True,
                              )
                      elif process.poll() is not None:
                          break

                  status = process.poll()
                  if status is not None:
                      break

                  if not selection_sent and now >= prompt_deadline:
                      failure = (
                          "Wix CLI did not show the expected commit selector "
                          "within 60 seconds; no selection was sent."
                      )
                      break

              if failure:
                  try:
                      os.killpg(process.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      process.wait()
                  print(f"::error::{failure}", file=sys.stderr, flush=True)
                  sys.exit(1)

              status = process.wait()
              if not selection_sent:
                  print(
                      "::error::Wix CLI exited before presenting its expected "
                      "commit selector; preview was not created.",
                      file=sys.stderr,
                      flush=True,
                  )
                  sys.exit(1)
              sys.exit(status)
          finally:
              os.close(master)
          PY

          preview_url="$(grep -Eo 'https?://wix\.to/[[:alnum:]]+' wix-preview.log | tail -n 1 || true)"
          if [ -z "${preview_url}" ]; then
            echo "::error::Wix CLI finished without a verifiable wix.to preview URL."
            cat wix-preview.log || true
            exit 1
          fi

          echo "url=${preview_url}" >> "${GITHUB_OUTPUT}"
          echo "Wix preview created: ${preview_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: warn
          path: wix-preview.log
