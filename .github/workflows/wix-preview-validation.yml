name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi
          wix login --api-key "${CLI_API_KEY}"

      - name: Create Wix preview from latest main (never publish)
        env:
          CI: "true"
          TERM: "xterm"
        run: |
          set -euo pipefail
          rm -f wix-preview.log wix-preview-url.txt

          if ! command -v script >/dev/null 2>&1; then
            echo "::error::The script utility is required to provide a pseudo-terminal to Wix CLI."
            exit 1
          fi

          # Wix CLI for Sites prompts for the source. The newline accepts its
          # documented default ("Latest commit from origin/main"). Keep a PTY:
          # running the CLI as a background non-interactive process causes TTY errors.
          if ! printf '\\n' | timeout 8m script -q -e -c "wix preview" /dev/null > wix-preview.log 2>&1; then
            echo "::error::Wix preview command failed or timed out."
            cat wix-preview.log || true
            exit 1
          fi

          # Fail closed: require Wix's documented deployment confirmation AND
          # the shareable wix.to URL. Generic strings such as "http", "ready",
          # localhost, or stack-trace documentation links are not success signals.
          if ! grep -Fq "Your preview deployment is now available at" wix-preview.log; then
            echo "::error::Wix CLI exited without its documented Preview deployment confirmation."
            cat wix-preview.log || true
            exit 1
          fi

          preview_url="$(grep -Eo 'https?://wix\\.to/[[:alnum:]]+' wix-preview.log | head -n 1 || true)"
          if [ -z "${preview_url}" ]; then
            echo "::error::Wix confirmed no extractable wix.to Preview URL."
            cat wix-preview.log || true
            exit 1
          fi

          printf '%s\\n' "${preview_url}" > wix-preview-url.txt
          echo "Wix Preview deployment confirmed: ${preview_url}"

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            wix-preview.log
