name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi
          wix login --api-key "${CLI_API_KEY}"

      - name: Create Wix preview from latest main (never publish)
        env:
          CI: "true"
          TERM: "xterm"
        run: |
          set -euo pipefail
          rm -f wix-preview.log

          # Keep the CLI's interactive TTY, but supervise it as a process group.
          # A Preview is considered ready only when Wix confirms the deployment URL.
          setsid bash -c 'printf "\\n" | script -q -e -c "wix preview" /dev/null' > wix-preview.log 2>&1 &
          preview_pid=$!

          cleanup() {
            kill -TERM -- "-${preview_pid}" >/dev/null 2>&1 || true
            wait "${preview_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for i in $(seq 1 240); do
            if grep -F "Your preview deployment is now available at" wix-preview.log >/dev/null 2>&1; then
              ready=true
              break
            fi

            if ! kill -0 "${preview_pid}" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [ "${ready}" != true ]; then
            echo "::error::Wix Preview did not confirm a deployment URL within 8 minutes."
            cat wix-preview.log || true
            exit 1
          fi

          echo "Wix confirmed that the Preview deployment is available."
          grep -F "Your preview deployment is now available at" wix-preview.log
          cleanup
          trap - EXIT

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            wix-preview.log
