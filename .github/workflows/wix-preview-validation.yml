name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi
          wix login --api-key "${CLI_API_KEY}"

      - name: Create and verify Wix Sites preview (never publish)
        env:
          CI: "true"
          TERM: "xterm"
        run: |
          set -euo pipefail
          rm -f wix-preview.log

          # Wix CLI for Sites presents an interactive source selector.
          # Select "Local code" (second option) so this PR branch is previewed.
          printf '\\033[B\\r' | timeout 8m script -q -e -c "wix preview" wix-preview.log

          # The official CLI for Sites emits a shareable http(s)://wix.to URL.
          # Require the command to exit successfully and verify that exact URL.
          preview_url="$(grep -Eo 'https?://wix\\.to/[A-Za-z0-9]+' wix-preview.log | tail -n 1 || true)"
          if [ -z "${preview_url}" ]; then
            echo "::error::Wix preview completed without an explicit wix.to URL."
            cat wix-preview.log || true
            exit 1
          fi

          curl --fail --silent --show-error --location --max-time 45 "${preview_url}" -o /dev/null
          echo "Wix preview is reachable: ${preview_url}"

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            wix-preview.log
