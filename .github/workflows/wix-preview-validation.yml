name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi
          wix login --api-key "${CLI_API_KEY}"

      - name: Create Wix preview from latest main (never publish)
        env:
          CI: "true"
          TERM: "xterm"
        run: |
          set -euo pipefail
          rm -f wix-preview.log wix-preview-url.txt

          for required_command in script setsid grep; do
            if ! command -v "${required_command}" >/dev/null 2>&1; then
              echo "::error::Required command not found: ${required_command}"
              exit 1
            fi
          done

          # Keep the CLI attached to a PTY, but supervise it in its own process
          # group. Wix may keep the interactive process alive after printing the
          # shareable Preview URL, so stop it only after the explicit success signal.
          setsid bash -c 'set -euo pipefail; printf "\n" | script -q -e -c "wix preview" /dev/null' > wix-preview.log 2>&1 &
          preview_pid=$!

          cleanup_preview() {
            kill -TERM -- "-${preview_pid}" >/dev/null 2>&1 || true
            for _ in $(seq 1 10); do
              if ! kill -0 "${preview_pid}" >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            kill -KILL -- "-${preview_pid}" >/dev/null 2>&1 || true
            wait "${preview_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup_preview EXIT

          preview_ready=false
          preview_url=""
          for _ in $(seq 1 240); do
            if grep -Fq "Your preview deployment is now available at" wix-preview.log; then
              preview_url="$(grep -Eo 'https?://wix\.to/[[:alnum:]]+' wix-preview.log | head -n 1 || true)"
              if [ -n "${preview_url}" ]; then
                preview_ready=true
                break
              fi
            fi

            if ! kill -0 "${preview_pid}" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          if [ "${preview_ready}" != "true" ]; then
            echo "::error::Wix Preview did not produce its explicit deployment confirmation and wix.to URL within 8 minutes."
            cat wix-preview.log || true
            exit 1
          fi

          printf '%s\n' "${preview_url}" > wix-preview-url.txt
          echo "Wix Preview deployment confirmed: ${preview_url}"

          cleanup_preview
          trap - EXIT

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            wix-preview.log
            wix-preview-url.txt
            wix-preview-url.txt
