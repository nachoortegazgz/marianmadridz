name: Wix Preview validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - ".github/workflows/wix-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build Wix preview from main
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "${CLI_API_KEY}" ]; then
            echo "::error::Missing repository secret CLI_API_KEY."
            exit 1
          fi
          wix login --api-key "${CLI_API_KEY}"

      - name: Build Wix project before preview
        run: wix build

      - name: Create and verify Wix preview (never publish)
        env:
          CI: "true"
          TERM: "xterm"
        run: |
          set -euo pipefail
          rm -f wix-preview.log

          # Wix CLI renders its interactive UI; allocate a real pseudo-terminal
          # in CI instead of redirecting stdin from a non-TTY background process.
          timeout 8m script -q -e -c "wix preview" wix-preview.log

          # Require a successful process exit and an explicit HTTPS link.
          # Generic words such as "http", "ready" or "preview" are not evidence.
          if ! grep -Eoq 'https://[^[:space:]"]+' wix-preview.log; then
            echo "::error::Wix CLI exited without returning a preview link."
            cat wix-preview.log || true
            exit 1
          fi

          echo "Wix preview command completed and returned an HTTPS link."
          grep -Eo 'https://[^[:space:]"]+' wix-preview.log | sort -u

      - name: Preserve preview output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-log-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            wix-preview.log
