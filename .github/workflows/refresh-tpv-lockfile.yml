name: Refresh TPV branch lockfile

on:
  push:
    branches:
      - fix/tpv-native-identities-cms-alignment-20261123
    paths:
      - .github/workflows/refresh-tpv-lockfile.yml

permissions:
  contents: write

concurrency:
  group: refresh-tpv-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: fix/tpv-native-identities-cms-alignment-20261123

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.22.1"

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify root dependency declarations
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          for (const section of ["dependencies", "devDependencies"]) {
            const declared = pkg[section] ?? {};
            const locked = lock.packages?.[""]?.[section] ?? {};
            for (const [name, version] of Object.entries(declared)) {
              if (locked[name] !== version) {
                throw new Error(`${section} mismatch for ${name}: package=${version}, lock=${locked[name] ?? "missing"}`);
              }
            }
          }
          if (lock.packages?.["node_modules/@wix/crm"]?.version !== "1.0.1686") {
            throw new Error("@wix/crm package entry missing or wrong version");
          }
          console.log("Root dependency declarations and @wix/crm package entry verified.");
          NODE

      - name: Commit only package-lock.json
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: synchronize npm lockfile"
          git push origin HEAD:fix/tpv-native-identities-cms-alignment-20261123
