name: Wix TPV Preview (non-production)

on:
  workflow_dispatch:
    inputs:
      create_preview:
        description: 'Create a Wix preview (requires the site to have been published at least once)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wix-tpv-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build non-production Wix preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require the approved main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this preview workflow from the approved main branch."
          exit 1

      - name: Checkout connected Wix site repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Verify Wix site binding
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const { siteId, uiVersion } = JSON.parse(fs.readFileSync("wix.config.json", "utf8"));
          if (siteId !== "188bed94-177c-4bc9-a9f0-35080d874f3e") {
            throw new Error("wix.config.json is not bound to the Marian Madrid site.");
          }
          if (!uiVersion) throw new Error("wix.config.json is missing uiVersion.");
          process.stdout.write(`Wix site binding verified; UI version ${uiVersion}.\n`);
          NODE

      - name: Check Wix CLI API key availability
        id: auth
        shell: bash
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [[ -n "${CLI_API_KEY:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Wix CLI API key
        if: steps.auth.outputs.available != 'true'
        run: |
          echo "::error::Preview cannot authenticate. Configure repository secret CLI_API_KEY using a Wix API key with the 'Wix CLI for Sites - Git Integration' permission and access to the Marian Madrid site."
          exit 1

      - name: Install locked project dependencies
        if: steps.auth.outputs.available == 'true'
        run: npm ci

      - name: Install Wix CLI for Sites
        if: steps.auth.outputs.available == 'true'
        run: npm install --global @wix/cli

      - name: Authenticate Wix CLI
        if: steps.auth.outputs.available == 'true'
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: npm run wix login -- --api-key "$CLI_API_KEY"

      - name: Skip preview unless explicitly requested
        if: steps.auth.outputs.available == 'true' && !inputs.create_preview
        run: echo "Authentication completed. Preview skipped; enable create_preview only after the site has been published at least once."

      - name: Create Wix preview only (never publish)
        if: steps.auth.outputs.available == 'true' && inputs.create_preview
        shell: bash
        run: script --quiet --return --command 'npm run wix preview' /dev/null
