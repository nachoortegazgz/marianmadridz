name: Wix TPV Editor Preview E2E

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: HTTPS Preview URL opened from Wix Editor / Local Editor for this commit
        required: true
        type: string
      mode:
        description: Start with read-only smoke; E2E writes require explicit isolation confirmation
        required: true
        type: choice
        options:
          - read-only
          - e2e
        default: read-only
      confirm_writes:
        description: Type YES only when explicitly authorizing operational test writes
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO
      data_isolation_confirmed:
        description: Type YES only after confirming the Wix CMS Sandbox is enabled and isolated
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

# Never cancel a running operational E2E: interruption after SESSION_OPEN can leave a session open.
concurrency:
  group: wix-tpv-editor-preview-e2e
  cancel-in-progress: false

jobs:
  tpv-e2e:
    name: Execute TPV bridge and persisted E2E against Editor Preview
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Verify Wix site binding
        run: |
          node -e "const c=require('./wix.config.json'); if(c.siteId!=='188bed94-177c-4bc9-a9f0-35080d874f3e'||!c.uiVersion) process.exit(1)"
      - name: Validate Editor Preview URL
        env:
          WIX_PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          node --input-type=module - <<'NODE'
          const value = process.env.WIX_PREVIEW_URL || "";
          const url = new URL(value);
          const host = url.hostname;
          const wixHost = host === "wix.com" || host.endsWith(".wix.com") ||
            host === "wixsite.com" || host.endsWith(".wixsite.com") ||
            host === "wix.to" || host.endsWith(".wix.to") ||
            host === "marianmadrid.es" || host === "www.marianmadrid.es";
          if (url.protocol !== "https:" || !wixHost) {
            throw new Error("WIX_PREVIEW_URL must be an HTTPS Wix Editor Preview URL");
          }
          NODE
      - name: Require explicit authorization for operational E2E
        if: inputs.mode == 'e2e'
        env:
          CONFIRM_WRITES: ${{ inputs.confirm_writes }}
          DATA_ISOLATION_CONFIRMED: ${{ inputs.data_isolation_confirmed }}
        run: |
          test "$CONFIRM_WRITES" = "YES" || { echo "::error::E2E writes were not explicitly authorized"; exit 1; }
          test "$DATA_ISOLATION_CONFIRMED" = "YES" || { echo "::error::Wix CMS Sandbox isolation has not been confirmed"; exit 1; }
      - run: npm ci
      - name: Decode authenticated browser state
        env:
          WIX_STORAGE_STATE_B64: ${{ secrets.WIX_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          test -n "$WIX_STORAGE_STATE_B64" || { echo "::error::Missing WIX_STORAGE_STATE_B64"; exit 1; }
          mkdir -p "$RUNNER_TEMP/wix-auth"
          printf '%s' "$WIX_STORAGE_STATE_B64" | base64 --decode > "$RUNNER_TEMP/wix-auth/storage-state.json"
          node -e "const s=require(process.argv[1]); if(!Array.isArray(s.cookies)||!Array.isArray(s.origins)) process.exit(1)" "$RUNNER_TEMP/wix-auth/storage-state.json"
          chmod 600 "$RUNNER_TEMP/wix-auth/storage-state.json"
      - name: Install Playwright (pinned)
        run: |
          npm install --global @playwright/test@1.65.1
          playwright install --with-deps chromium
      - name: Execute authenticated TPV E2E
        env:
          WIX_PREVIEW_URL: ${{ inputs.preview_url }}
          WIX_STORAGE_STATE_PATH: ${{ runner.temp }}/wix-auth/storage-state.json
          WIX_TPV_E2E_REPORT: ${{ runner.temp }}/wix-tpv-e2e.json
          WIX_TPV_PAGE_PATH: /tpv
          WIX_TPV_E2E_MODE: ${{ inputs.mode }}
          WIX_TPV_E2E_ALLOW_WRITES: ${{ inputs.confirm_writes }}
          WIX_TPV_DATA_ISOLATION_CONFIRMED: ${{ inputs.data_isolation_confirmed }}
        run: |
          export PLAYWRIGHT_MODULE_ROOT="$(npm root --global)"
          node scripts/wix-preview-tpv-e2e.mjs
      - name: Upload E2E report only (never storageState)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wix-tpv-editor-preview-e2e
          path: ${{ runner.temp }}/wix-tpv-e2e.json
          if-no-files-found: warn
          retention-days: 7
