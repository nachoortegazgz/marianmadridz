name: Wix QA preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-qa-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # API keys are not available to forked PRs. Same-repository PRs and manual
    # runs are supported; fork PRs remain covered by the offline CI workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIX_CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
    steps:
      - name: Checkout candidate code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Wix CLI for Sites
        run: npm install --global @wix/cli

      - name: Validate Wix API key secret
        shell: bash
        run: |
          if [[ -z "${WIX_CLI_API_KEY}" ]]; then
            echo "::error::GitHub secret CLI_API_KEY is missing."
            exit 1
          fi

      - name: Authenticate Wix CLI for Sites
        run: npm run wix login -- --api-key "${WIX_CLI_API_KEY}"

      - name: Create preview from this PR branch
        shell: bash
        run: |
          set -euo pipefail
          npm run wix preview 2>&1 | tee wix-preview.log

      - name: Require Wix's explicit preview URL
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          preview_url="$(grep -Eo 'https?://wix\.to/[A-Za-z0-9]+' wix-preview.log | tail -n 1 || true)"
          if [[ -z "${preview_url}" ]]; then
            echo "::error::Wix CLI exited without the documented preview deployment URL. This is not a Preview PASS."
            exit 1
          fi
          echo "url=${preview_url}" >> "$GITHUB_OUTPUT"
          echo "### Wix Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the generated preview URL
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          curl --fail --location --silent --show-error --max-time 60 \
            --output /dev/null "${PREVIEW_URL}"

      - name: Preserve Wix Preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-diagnostics
          path: wix-preview.log
          if-no-files-found: ignore
          retention-days: 14
