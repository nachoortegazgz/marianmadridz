name: Wix QA preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# No cancelar una preview en curso por cada nuevo push a la PR.
concurrency:
  group: wix-qa-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    # Los secretos no están disponibles en PRs de forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLI_API_KEY: ${{ secrets.CLI_API_KEY }}

    steps:
      - name: Checkout candidate code
        uses: actions/checkout@v4
        with:
          # Prueba el código enviado a la PR, no el merge commit generado por GitHub.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Wix CLI
        run: npm install --global @wix/cli

      - name: Validate Wix API key
        shell: bash
        run: |
          if [[ -z "${CLI_API_KEY}" ]]; then
            echo "::error::Falta el secreto CLI_API_KEY en GitHub Actions."
            exit 1
          fi

      - name: Authenticate Wix CLI
        run: npm run wix login -- --api-key "${CLI_API_KEY}"

      - name: Create local preview without interactive prompts
        shell: bash
        run: |
          set -o pipefail
          timeout 600s npm run wix preview -- --source local 2>&1 | tee wix-preview.log

      - name: Require Wix preview URL
        id: preview
        shell: bash
        run: |
          set -euo pipefail

          preview_url="$(grep -Eo 'https?://wix\.to/[A-Za-z0-9]+' wix-preview.log | tail -n 1 || true)"
          if [[ -z "${preview_url}" ]]; then
            echo "::error::Wix CLI terminó sin proporcionar una URL de preview válida."
            exit 1
          fi

          echo "url=${preview_url}" >> "$GITHUB_OUTPUT"
          echo "### Wix Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test preview URL
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          curl --fail --location --silent --show-error --max-time 60 \
            --output /dev/null "${PREVIEW_URL}"

      - name: Preserve Wix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-preview-diagnostics
          path: wix-preview.log
          if-no-files-found: ignore
          retention-days: 14
