name: Backend quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "chore/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  backend-offline-tests:
    name: Backend offline regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run offline backend regression tests
        run: npm test

  clean-install-and-lint:
    name: Clean dependency install and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install declared dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint
  windows-node-compatibility:
    name: Windows Node.js ${{ matrix.node-version }} regression
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.22.1", "26.12.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install declared dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run complete backend regression suite
        run: npm test
      - name: Run layer 1 regression suite
        run: npm run test:layer1
      - name: Run layer 2 regression suite
        run: npm run test:layer2
      - name: Run ESLint
        run: npm run lint
