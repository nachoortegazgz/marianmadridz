name: Backend offline tests

on:
  pull_request:
  push:
    branches:
      - main
      - "chore/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  backend-offline-tests:
    name: Backend offline regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run offline backend regression tests
        run: npm test
