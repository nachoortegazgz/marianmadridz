name: Wix production publish

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "#html*.txt"
      - "package.json"
      - "package-lock.json"
      - "wix.config.json"
      - "dependencies-metadata.json"
      - "wix.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-production-publish
  cancel-in-progress: false

jobs:
  quality-and-publish:
    name: Verify and publish Wix site from main
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Verify this is the latest main commit
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_sha"
          test "$local_sha" = "$remote_sha"
          echo "Publishing main commit: $local_sha"

      - name: Verify target Wix site
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync("wix.config.json", "utf8"));
            if (config.siteId !== "188bed94-177c-4bc9-a9f0-35080d874f3e") {
              throw new Error("wix.config.json siteId does not match Marian Madrid production site");
            }
            if (!/^\d+$/.test(String(config.uiVersion ?? ""))) {
              throw new Error("wix.config.json uiVersion is missing or invalid");
            }
            console.log("Wix siteId and pinned UI version verified:", config.uiVersion);
          '

      - name: Install locked project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # npm test runs the complete suite once, including all Layer 1 and Layer 2 suites.
      - name: Run full offline regression suite
        run: npm test

      - name: Verify Wix eCommerce and Data SDK contracts
        run: npm run verify:wix-ecom-cart-v2

      - name: Verify Wix Bookings Reader V2 SDK contract
        run: npm run verify:wix-bookings-reader-v2

      - name: Run ESLint
        run: npm run lint

      - name: Install pinned Wix CLI for Sites
        run: |
          set -euo pipefail
          npm install --global @wix/cli@1.2.9 --no-audit --no-fund
          npm list --global @wix/cli --depth=0
          npm list --global @wix/cli --depth=0 | grep -F '@wix/cli@1.2.9'

      - name: Authenticate Wix CLI
        env:
          CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLI_API_KEY"
          npm run wix login -- --api-key "$CLI_API_KEY"
          npm run wix whoami

      - name: Self-test Wix publish PTY controller
        run: python3 scripts/wix-publish-pty.py --self-test

      - name: Publish latest main code to Wix with prompt-aware PTY controller
        env:
          CI: "true"
          TERM: "xterm"
        run: python3 scripts/wix-publish-pty.py

      - name: Preserve Wix publish transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-publish-transcript-${{ github.run_id }}
          if-no-files-found: warn
          path: wix-publish.log

      - name: Verify public site responds
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location https://www.marianmadrid.es/ --output /dev/null; then
              echo "Public site responds successfully."
              exit 0
            fi
            sleep 10
          done
          echo "Public site did not return a successful HTTP response after publish." >&2
          exit 1
