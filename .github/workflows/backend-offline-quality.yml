name: Backend offline quality gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Layer 1 and 2 QA, offline regression, SDK contract and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify checked-out repository workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          repository_root="$(git rev-parse --show-toplevel)"
          test "$workspace" = "$repository_root"
          printf 'GitHub workspace: %s\nRepository root: %s\n' "$workspace" "$repository_root"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The canonical npm test runner includes every Layer 1 and Layer 2 suite once.
      - name: Run complete offline regression suite
        run: npm test

      - name: Capture individual failing suite diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          for suite in accountingLedger.writer.offline.test.mjs crons.booking-projection-reconciliation.test.mjs dto.whitelist.test.mjs reservas.web.test.mjs widget.handshake.contract.test.mjs; do
            echo "===== Diagnostic run: ${suite} ====="
            node --no-warnings --loader ./src/backend/tests/loader.mjs "./src/backend/tests/${suite}" || true
          done

      - name: Verify installed Wix SDK contracts
        if: always()
        run: npm run verify:wix-ecom-cart-v2

      - name: Verify Wix eCommerce Order Transactions SDK contract
        if: always()
        run: npm run verify:wix-ecom-order-transactions

      - name: Verify Wix Bookings Reader V2 SDK contract
        if: always()
        run: npm run verify:wix-bookings-reader-v2

      - name: Run ESLint
        if: always()
        run: npm run lint
