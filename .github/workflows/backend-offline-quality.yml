name: Backend offline quality gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Layer 1 and 2 QA, offline regression, SDK contract and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify checked-out repository workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          repository_root="$(git rev-parse --show-toplevel)"
          test "$workspace" = "$repository_root"
          printf 'GitHub workspace: %s\nRepository root: %s\n' "$workspace" "$repository_root"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Focused layer gates make the acceptance status explicit. The full suite below
      # remains the canonical regression gate and covers every test file once.
      - name: Run Layer 1 focused regression gate
        run: npm run test:layer1

      - name: Run Layer 2 focused regression gate
        run: npm run test:layer2

      # The canonical npm test runner includes every Layer 1 and Layer 2 suite once.
      - name: Run complete offline regression suite
        run: npm test

      - name: Capture complete Layer 1 failure diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          npm run test:layer1 > "$RUNNER_TEMP/layer1-diagnostics.log" 2>&1 || true
          cat "$RUNNER_TEMP/layer1-diagnostics.log"

      - name: Upload Layer 1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer1-diagnostics
          path: ${{ runner.temp }}/layer1-diagnostics.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify installed Wix SDK contracts
        if: always()
        run: npm run verify:wix-ecom-cart-v2

      - name: Verify Wix eCommerce Order Transactions SDK contract
        if: always()
        run: npm run verify:wix-ecom-order-transactions

      - name: Verify Wix TPV catalog SDK contracts
        if: always()
        run: npm run verify:wix-tpv-native-sdk

      - name: Run ESLint
        if: always()
        run: npm run lint
