name: Backend offline quality gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Layer 1 and 2 QA, offline regression, SDK contract and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Verify checked-out repository workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          repository_root="$(git rev-parse --show-toplevel)"
          test "$workspace" = "$repository_root"
          printf 'GitHub workspace: %s\nRepository root: %s\n' "$workspace" "$repository_root"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Verify dependency installation
        shell: bash
        run: |
          set -euo pipefail
          npm ls --depth=0
          npm exec --no -- eslint --version
          node --input-type=module <<'NODE'
          for (const packageName of ["@wix/ecom", "@wix/bookings", "eslint"]) {
            console.log(packageName, import.meta.resolve(packageName));
          }
          NODE

      - name: Audit locked npm dependency graph
        id: npm-audit
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          audit_exit=$?
          set -e

          node - "$RUNNER_TEMP/npm-audit.json" \
            "$RUNNER_TEMP/npm-audit-summary.json" \
            "$audit_exit" <<'NODE'
          const fs = require("node:fs");
          const [reportPath, summaryPath, auditExitText] = process.argv.slice(2);

          const auditExit = Number(auditExitText);
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

          if (report.error || !report.metadata?.vulnerabilities) {
            console.error(
              "npm audit did not return a valid vulnerability report:",
              report.error ?? "missing metadata"
            );
            process.exit(1);
          }

          const counts = report.metadata.vulnerabilities;
          const summary = {
            info: counts.info ?? 0,
            low: counts.low ?? 0,
            moderate: counts.moderate ?? 0,
            high: counts.high ?? 0,
            critical: counts.critical ?? 0,
            total: counts.total ?? 0
          };

          console.log("npm audit:", JSON.stringify(summary));
          fs.writeFileSync(summaryPath, JSON.stringify(summary, null, 2) + "\n");

          if (auditExit !== 0 && summary.total === 0) {
            console.error(
              "npm audit exited unsuccessfully without reporting advisories; fail closed."
            );
            process.exit(1);
          }

          if (summary.high > 0 || summary.critical > 0) {
            console.error("High or critical npm advisories block this quality gate.");
            process.exit(1);
          }

          if (summary.total > 0) {
            console.warn(
              "Low/moderate advisories require review; see the uploaded audit artifact."
            );
          }
          NODE

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-dependency-audit
          path: |
            ${{ runner.temp }}/npm-audit.json
            ${{ runner.temp }}/npm-audit-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run Layer 1 focused regression gate
        run: npm run test:layer1

      - name: Run Layer 2 focused regression gate
        run: npm run test:layer2

      - name: Run complete offline regression suite
        run: npm test

      - name: Verify Wix eCommerce cart SDK contract
        run: npm run verify:wix-ecom-cart-v2

      - name: Verify Wix eCommerce order transactions SDK contract
        run: npm run verify:wix-ecom-order-transactions

      - name: Verify Wix TPV catalog SDK contracts
        run: npm run verify:wix-tpv-native-sdk

      - name: Run ESLint
        run: npm run lint

      - name: Capture Layer 1 failure diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          npm run test:layer1 > "$RUNNER_TEMP/layer1-diagnostics.log" 2>&1 || true
          cat "$RUNNER_TEMP/layer1-diagnostics.log"

      - name: Upload Layer 1 diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer1-diagnostics
          path: ${{ runner.temp }}/layer1-diagnostics.log
          if-no-files-found: ignore
          retention-days: 1
