name: Backend offline quality gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package and lockfile synchronization
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockDependencies = packageLock.packages?.[""]?.dependencies ?? {};

          const packageDependencies = packageJson.dependencies ?? {};
          const packageDevDependencies = packageJson.devDependencies ?? {};
          const lockDevDependencies = packageLock.packages?.[""]?.devDependencies ?? {};
          const declarations = [
            ...Object.entries(packageDependencies).map(([name, version]) => ({ name, version, section: "dependencies", root: lockDependencies[name] })),
            ...Object.entries(packageDevDependencies).map(([name, version]) => ({ name, version, section: "devDependencies", root: lockDevDependencies[name] })),
          ];
          const mismatches = declarations.flatMap(({ name, version, section, root }) => {
            const installed = packageLock.packages?.[`node_modules/${name}`]?.version;
            const issues = [];
            if (root !== version) issues.push({ name, section, expected: version, actual: root ?? "missing", kind: "root" });
            if (installed !== version) issues.push({ name, section, expected: version, actual: installed ?? "missing", kind: "package" });
            return issues;
          });

          if (mismatches.length) {
            console.error("package.json/package-lock.json are out of sync:");
            for (const name of mismatches) {
              console.error(`- ${name.section}.${name.name} [${name.kind}]: expected=${name.expected}, actual=${name.actual}`);
            }
            process.exit(1);
          }

          console.log("package.json and package-lock.json dependencies match.");
          NODE

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Verify critical dependencies
        run: |
          node --input-type=module <<'NODE'
          for (const packageName of ["@wix/ecom", "@wix/bookings", "@wix/crm"]) {
            console.log(`${packageName}: ${import.meta.resolve(packageName)}`);
          }
          NODE
          npm exec --no -- eslint --version

      - name: Audit dependencies
        id: npm-audit
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          exit_code=$?
          set -e
          echo "npm_audit_exit=$exit_code" >> "$GITHUB_OUTPUT"

          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8")
          );
          if (report.error) {
            console.error("npm audit failed:", report.error);
            process.exit(1);
          }
          const counts = report.metadata?.vulnerabilities;
          if (!counts) {
            console.error("npm audit returned no vulnerability metadata.");
            process.exit(1);
          }

          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/npm-audit-summary.json",
            JSON.stringify(counts, null, 2) + "\n"
          );

          if (counts.high > 0 || counts.critical > 0) {
            console.error("High or critical npm advisories found.");
            process.exit(1);
          }
          NODE

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-dependency-audit
          path: |
            ${{ runner.temp }}/npm-audit.json
            ${{ runner.temp }}/npm-audit-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run Layer 1
        run: npm run test:layer1

      - name: Run Layer 2
        run: npm run test:layer2

      - name: Run complete offline suite
        run: npm test

      - name: Verify Wix eCommerce cart SDK
        run: npm run verify:wix-ecom-cart-v2

      - name: Verify Wix eCommerce transactions SDK
        run: npm run verify:wix-ecom-order-transactions

      - name: Verify Wix TPV SDK
        run: npm run verify:wix-tpv-native-sdk

      - name: Run ESLint
        run: npm run lint
